<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ORIZONS | Security Portal</title>

        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;400;500&display=swap"
            rel="stylesheet">

        <link rel="stylesheet" href="../global/style.css">
        <link rel="stylesheet" href="admin.css">
    </head>
    <body>

        <div class="custom-cursor"></div>
        <div class="cursor-follower"></div>

        <main class="login-vault">
            <div class="auth-visual-bg"></div>

            <div class="auth-card">
                <div class="lock-icon-wrapper">
                    <div class="logo-mark"
                        style="margin: 0 auto 20px; background: var(--gold-brass);"></div>
                </div>

                <p class="mini-label">SECURITY PORTAL</p>
                <h2>ENTER CREDENTIALS</h2>

                <form id="admin-login-form">
                    <div class="input-group">
                        <label>USERNAME</label>
                        <input type="text" id="admin-user"
                            placeholder="Architect ID" required>
                    </div>

                    <div class="input-group">
                        <label>PASSWORD</label>
                        <input type="password" id="admin-pass"
                            placeholder="••••••••" minlength="8" required>
                        <small id="pass-hint">ENCRYPTION LEVEL:
                            BCRYPT-10</small>
                    </div>

                    <button type="submit" class="btn-primary" id="auth-btn">
                        <span>AUTHENTICATE</span>
                    </button>

                    <p id="login-error"></p>
                </form>
            </div>
        </main>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

        <script src="../global/app.js"></script>
    </body>
</html>
